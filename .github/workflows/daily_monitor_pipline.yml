name: Daily Price Monitor Pipeline

on:
  schedule:
    # Triggers every hour from 03:15 UTC to 09:15 UTC (8:45 AM to 2:45 PM IST) Mon-Fri
    - cron: '15 3,4,5,6,7,8,9 * * 1-5'
  workflow_dispatch:

jobs:
  run-intraday:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: |
          uv sync

      - name: Run Intraday Monitor
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          uv run python src/trading/price_monitor.py --timeframe intraday