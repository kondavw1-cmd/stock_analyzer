name: Weekly Price Monitor (Thu & Fri 2:30 PM IST)

on:
  schedule:
    # 9:00 UTC = 2:30 PM IST on Thursday (4) and Friday (5)
    - cron: '0 9 * * 4,5'
  workflow_dispatch:

jobs:
  run-weekly:
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: |
          uv sync

      - name: Run Weekly Monitor
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python src/trading/price_monitor.py --timeframe weekly