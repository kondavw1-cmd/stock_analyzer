name: Stock Analysis Pipeline

on:
  schedule:
    # Runs Monday through Friday at 16:00 UTC (9:30 PM IST)
    - cron: '0 16 * * 1-5'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: |
          uv sync

      - name: Decode Gmail Token (if configured)
        env:
          GMAIL_TOKEN_BASE64: ${{ secrets.GMAIL_TOKEN_BASE64 }}
        run: |
          if [ -n "$GMAIL_TOKEN_BASE64" ]; then
            echo "$GMAIL_TOKEN_BASE64" | base64 --decode > token.json
          fi

      - name: Execute Pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GMAIL_SENDER_EMAIL: ${{ secrets.GMAIL_SENDER_EMAIL }}
        run: |
          uv run main.py --mode debug --skip-email